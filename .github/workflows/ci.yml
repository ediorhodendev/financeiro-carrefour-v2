name: build-test-evaluate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.403
      - run: dotnet restore Financial.slnx
      - run: dotnet build Financial.slnx -c Release --no-restore
      - run: dotnet test Financial.slnx -c Release --no-build --logger trx --results-directory TestResults
      - run: docker compose up --build -d
      - run: python3 scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: validation-results
          path: |
            TestResults
            compose.log
      - if: always()
        run: docker compose down -v
